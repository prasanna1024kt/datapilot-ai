services:

  # ============================================================
  # PostgreSQL
  # ============================================================

  postgres:
    image: postgres:16
    container_name: datapilot-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # Airflow Database Initialization
  # ============================================================

  airflow-init:
    image: apache/airflow:3.3.1
    container_name: datapilot-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AWS_PROFILE: ${AWS_PROFILE}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ~/.aws:/home/airflow/.aws:ro

    command:
      - bash
      - -c
      - |
        airflow db migrate


  # ============================================================
  # Airflow API Server
  # ============================================================

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: datapilot-airflow

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "True"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow:8080/execution/"
      AWS_PROFILE: ${AWS_PROFILE}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AIRFLOW__API_AUTH__JWT_SECRET: "QGZC7j8rUrJj1ndiMYhlznvt8vol2tj1bNiALPcGKy-jtX_ahMk_Uku5ivBjZFFyWrmkucTk0X57RTgYgCci_g"


    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ~/.aws:/home/airflow/.aws:ro

      # Spark applications
      - ./spark:/opt/spark-apps

      # DataPilot configuration
      - ./config:/opt/datapilot/config:ro

    ports:
      - "8080:8080"

    command: api-server


  # ============================================================
  # Airflow Scheduler
  # ============================================================

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: datapilot-airflow-scheduler

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTE_TASKS_NEW_PYTHON_INTERPRETER: "True"
      AWS_PROFILE: ${AWS_PROFILE}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "QGZC7j8rUrJj1ndiMYhlznvt8vol2tj1bNiALPcGKy-jtX_ahMk_Uku5ivBjZFFyWrmkucTk0X57RTgYgCci_g"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ~/.aws:/home/airflow/.aws:ro
      - ~/.aws:/opt/spark/.aws:ro
      - ./spark:/opt/spark-apps
      - ./config:/opt/datapilot/config:ro
      - ./results:/opt/datapilot/results

    command: scheduler


  # ============================================================
  # Airflow DAG Processor
  # ============================================================

  airflow-dag-processor:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: datapilot-airflow-dag-processor

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"

      AWS_PROFILE: ${AWS_PROFILE}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ~/.aws:/home/airflow/.aws:ro

      # Spark applications
      - ./spark:/opt/spark-apps

      # DataPilot configuration
      - ./config:/opt/datapilot/config:ro

    command: dag-processor


  # ============================================================
  # Airflow Triggerer
  # ============================================================

  airflow-triggerer:
    image: apache/airflow:3.3.1
    container_name: datapilot-airflow-triggerer

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AWS_PROFILE: ${AWS_PROFILE}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}

    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ~/.aws:/home/airflow/.aws:ro

    command: triggerer


  # ============================================================
  # Spark Master
  # ============================================================

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    container_name: datapilot-spark-master

    environment:
      HOME: /opt/spark

      AWS_PROFILE: datapilot
      AWS_DEFAULT_REGION: us-east-1

      AWS_SHARED_CREDENTIALS_FILE: /opt/spark/.aws/credentials
      AWS_CONFIG_FILE: /opt/spark/.aws/config

    volumes:
      - ./spark:/opt/spark-apps
      - ./config:/opt/datapilot/config:ro
      - ~/.aws:/opt/spark/.aws:ro

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master

    ports:
      - "7077:7077"
      - "8081:8080"


  # ============================================================
  # Spark Worker
  # ============================================================

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    container_name: datapilot-spark-worker

    depends_on:
      - spark-master

    environment:
      HOME: /opt/spark

      AWS_PROFILE: datapilot
      AWS_DEFAULT_REGION: us-east-1

      AWS_SHARED_CREDENTIALS_FILE: /opt/spark/.aws/credentials
      AWS_CONFIG_FILE: /opt/spark/.aws/config

    volumes:
      - ./spark:/opt/spark-apps
      - ./config:/opt/datapilot/config:ro
      - ~/.aws:/opt/spark/.aws:ro

    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077


  # ============================================================
  # Spark Development / Debug Container
  # ============================================================

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile

    container_name: datapilot-spark

    environment:
      HOME: /opt/spark

      AWS_PROFILE: datapilot
      AWS_DEFAULT_REGION: us-east-1

      AWS_SHARED_CREDENTIALS_FILE: /opt/spark/.aws/credentials
      AWS_CONFIG_FILE: /opt/spark/.aws/config

    volumes:
      - ./spark:/opt/spark-apps
      - ./config:/opt/datapilot/config:ro
      - ~/.aws:/opt/spark/.aws:ro

    command: tail -f /dev/null


# ==============================================================
# Named Volumes
# ==============================================================

volumes:
  postgres_data:
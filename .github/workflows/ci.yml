
name: DataPilot AI CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:

  # --------------------------------------------------
  # JOB 1: FULL PYTEST SUITE
  # --------------------------------------------------
  test:
    name: Pytest - Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-copilot.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-copilot.txt
          pip install pyspark==4.1.3

      - name: Prepare CI-only environment
        run: |
          cat > .env <<'EOF'
          AIRFLOW_FERNET_KEYRING=ci-placeholder-fernet-key
          AWS_ACCESS_KEY_ID=ci-placeholder-access-key
          AWS_SECRET_ACCESS_KEY=ci-placeholder-secret-key
          AWS_DEFAULT_REGION=us-east-1
          AWS_PROFILE=ci
          DATAPILOT_ENV=ci
          LANGSMITH_API_KEY=ci-placeholder-langsmith-key
          LANGSMITH_PROJECT=datapilot-ci
          LANGSMITH_TRACING=false
          OPENAI_API_KEY=ci-placeholder-openai-key
          MCP_AUDIT_DB_HOST=postgres
          MCP_AUDIT_DB_PORT=5432
          MCP_AUDIT_DB_NAME=datapilot_ci
          MCP_AUDIT_DB_USER=ci_user
          MCP_AUDIT_DB_PASSWORD=ci-placeholder-db-password
          EOF

      - name: Run complete pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest -q


  # --------------------------------------------------
  # JOB 2: TEST COVERAGE
  # --------------------------------------------------
  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-copilot.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-copilot.txt
          pip install pyspark==4.1.3 pytest-cov

      - name: Prepare CI-only environment
        run: |
          cat > .env <<'EOF'
          AIRFLOW_FERNET_KEYRING=ci-placeholder-fernet-key
          AWS_ACCESS_KEY_ID=ci-placeholder-access-key
          AWS_SECRET_ACCESS_KEY=ci-placeholder-secret-key
          AWS_DEFAULT_REGION=us-east-1
          AWS_PROFILE=ci
          DATAPILOT_ENV=ci
          LANGSMITH_API_KEY=ci-placeholder-langsmith-key
          LANGSMITH_PROJECT=datapilot-ci
          LANGSMITH_TRACING=false
          OPENAI_API_KEY=ci-placeholder-openai-key
          MCP_AUDIT_DB_HOST=postgres
          MCP_AUDIT_DB_PORT=5432
          MCP_AUDIT_DB_NAME=datapilot_ci
          MCP_AUDIT_DB_USER=ci_user
          MCP_AUDIT_DB_PASSWORD=ci-placeholder-db-password
          EOF

      - name: Run coverage analysis
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            --cov=copilot \
            --cov=agents \
            --cov=mcp_server \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datapilot-coverage-report
          path: coverage.xml
          if-no-files-found: ignore


  # --------------------------------------------------
  # JOB 3: PYLINT CODE QUALITY
  # --------------------------------------------------
  lint:
    name: Pylint - Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-copilot.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-copilot.txt
          pip install pyspark==4.1.3 pylint

      - name: Run Pylint
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pylint \
            copilot \
            agents \
            mcp_server \
            --fail-under=8.0 \
            --output-format=colorized

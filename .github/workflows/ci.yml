name: DataPilot AI CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: datapilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    name: Test and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-copilot.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-copilot.txt

      - name: Install Spark Python dependency
        run: pip install pyspark==4.1.3

      - name: Prepare CI-only environment
        run: |
          cat > .env <<'EOF'
          AIRFLOW_FERNET_KEYRING=ci-placeholder-fernet-key
          AWS_ACCESS_KEY_ID=ci-placeholder-access-key
          AWS_SECRET_ACCESS_KEY=ci-placeholder-secret-key
          AWS_DEFAULT_REGION=us-east-1
          AWS_PROFILE=ci
          DATAPILOT_ENV=ci
          LANGSMITH_API_KEY=ci-placeholder-langsmith-key
          LANGSMITH_PROJECT=datapilot-ci
          LANGSMITH_TRACING=false
          OPENAI_API_KEY=ci-placeholder-openai-key
          MCP_AUDIT_DB_HOST=postgres
          MCP_AUDIT_DB_PORT=5432
          MCP_AUDIT_DB_NAME=datapilot_ci
          MCP_AUDIT_DB_USER=ci_user
          MCP_AUDIT_DB_PASSWORD=ci-placeholder-db-password
          EOF

      - name: Run deployment-critical tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q \
            tests/test_airflow_service_smoke.py \
            tests/test_approval_request.py \
            tests/test_copilot_api.py \
            tests/test_plan_fingerprint.py \
            tests/test_quarantine_fingerprint_guard.py \
            tests/test_remediation_executor.py

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

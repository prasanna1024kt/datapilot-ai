dataset: olist_order_items

checks:

  row_count:
    enabled: true
    min: 1

  required_columns:
    enabled: true
    columns:
      - order_id
      - order_item_id
      - product_id
      - seller_id
      - price
      - freight_value

  null_checks:
    enabled: true
    columns:
      - order_id
      - product_id
      - seller_id

  duplicate_check:
    enabled: true
    keys:
      - order_id
      - order_item_id

  range_checks:
    enabled: true

    price:
      min: 0
      max: 100000

    freight_value:
      min: 0
      max: 100000